<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    /* Safari paints a white canvas behind SVG favicons that don't opt into
       both color schemes, so the yellow dot sat on white in dark mode. */
    :root {
      color-scheme: light dark;
    }
  </style>
  <!-- Inset so Safari's rounded-square mask still reads as a circle. -->
  <circle cx="16" cy="16" r="12" fill="#FEE064"/>
</svg>
